<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Play button -->
  <polygon points="45,35 45,93 95,64" fill="#e94560" opacity="0.9"/>
  <!-- Speed indicator -->
  <text x="64" y="52" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#7ec8e3" text-anchor="middle">3x</text>
  <!-- Camera icon hint -->
  <rect x="38" y="78" width="52" height="30" rx="4" fill="none" stroke="#4ecca3" stroke-width="2.5"/>
  <circle cx="64" cy="93" r="8" fill="none" stroke="#4ecca3" stroke-width="2.5"/>
  <rect x="55" y="75" width="18" height="5" rx="2" fill="#4ecca3"/>
</svg>
