<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Screenshot & Speed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #111;
      color: #eee;
      padding: 20px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- 速度区域 ---- */
    .speed-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .speed-value {
      font-size: 48px;
      font-weight: 200;
      color: #fff;
      letter-spacing: -2px;
      line-height: 1;
      user-select: none;
    }
    .speed-value .unit {
      font-size: 18px;
      font-weight: 300;
      color: #666;
      margin-left: 2px;
      letter-spacing: 0;
    }

    /* 滑块 */
    .slider-wrap {
      margin: 16px 0 14px;
      position: relative;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      background: #333;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 3px #111, 0 0 0 4px #444;
      transition: box-shadow 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 3px #111, 0 0 0 4px #888;
    }
    input[type="range"]:focus::-webkit-slider-thumb {
      box-shadow: 0 0 0 3px #111, 0 0 0 4px #fff;
    }

    /* 预设速度 */
    .presets {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .preset {
      width: 36px;
      height: 28px;
      border: 1px solid #333;
      border-radius: 14px;
      background: transparent;
      color: #666;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preset:hover {
      border-color: #666;
      color: #ccc;
    }
    .preset.active {
      background: #fff;
      border-color: #fff;
      color: #111;
    }

    /* ---- 分割线 ---- */
    .divider {
      height: 1px;
      background: #222;
      margin: 16px 0;
    }

    /* ---- 截图区域 ---- */
    .screenshot-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .capture-btn {
      width: 100%;
      height: 40px;
      border: 1px solid #333;
      border-radius: 20px;
      background: transparent;
      color: #eee;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .capture-btn:hover {
      border-color: #fff;
      background: #fff;
      color: #111;
    }
    .capture-btn:active {
      transform: scale(0.97);
    }
    .capture-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 格式选择 */
    .formats {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .fmt {
      padding: 4px 12px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: #555;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .fmt:hover { color: #999; }
    .fmt.active {
      background: #222;
      color: #ddd;
    }

    /* ---- 状态 ---- */
    .status {
      text-align: center;
      font-size: 10px;
      color: #333;
      margin-top: 14px;
      transition: color 0.3s;
    }
    .status.ok { color: #555; }
    .status.err { color: #663333; }
  </style>
</head>
<body>

  <div class="speed-section">
    <div class="speed-value">
      <span id="speedNum">1.0</span><span class="unit">x</span>
    </div>
    <div class="slider-wrap">
      <input type="range" id="slider" min="0.1" max="3" step="0.1" value="1">
    </div>
    <div class="presets">
      <button class="preset" data-speed="0.5">0.5</button>
      <button class="preset active" data-speed="1">1.0</button>
      <button class="preset" data-speed="1.5">1.5</button>
      <button class="preset" data-speed="2">2.0</button>
      <button class="preset" data-speed="2.5">2.5</button>
      <button class="preset" data-speed="3">3.0</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="screenshot-section">
    <button class="capture-btn" id="captureBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      截取当前帧
    </button>
    <div class="formats">
      <button class="fmt active" data-format="png">PNG</button>
      <button class="fmt" data-format="jpeg">JPEG</button>
      <button class="fmt" data-format="webp">WebP</button>
    </div>
  </div>

  <div class="status" id="status">检测视频中…</div>

  <script src="popup.js"></script>
</body>
</html>
